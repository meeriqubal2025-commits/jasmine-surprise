<title>A Little Surprise 💗</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;
font-family:Georgia,serif;color:#542b3b;background:radial-gradient(circle at top,#fff2f6,#f8dce8 55%,#efc7d8)}
.card{width:min(92vw,440px);min-height:510px;padding:34px 25px;border:1px solid #ffffffa8;
border-radius:28px;background:#fffafcdd;box-shadow:0 18px 55px #9d587733;text-align:center;
display:flex;flex-direction:column;align-items:center;justify-content:center}
.heart{font-size:35px;margin-bottom:12px} h1{font-size:clamp(25px,6vw,34px);line-height:1.25;margin:8px 0 16px}
p{font-family:Arial,sans-serif;font-size:16px;line-height:1.65;color:#815568;margin:0 0 24px}
button{border:0;border-radius:999px;padding:14px 27px;background:#c6537c;color:white;font-size:15px;
font-weight:700;letter-spacing:.3px;cursor:pointer;box-shadow:0 7px 18px #c6537c44}
button:active{transform:scale(.97)} .tiny{font-size:12px;margin-top:18px;color:#b27a91}
.warning{animation:redPulse .75s infinite; border-color:#ff5b68}
.warning .heart{color:#ff334f;text-shadow:0 0 12px #ff334f}
.warning h1{color:#c51e38;text-shadow:0 0 10px #ff6b7d}
@keyframes redPulse{0%,100%{box-shadow:0 0 12px #ff334f55,0 18px 55px #9d587733}
50%{box-shadow:0 0 30px 9px #ff263f99,0 18px 55px #9d587733}}
.emoji-rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.emoji-rain span{position:absolute;top:-12vh;font-size:clamp(20px,4vw,32px);
animation:fall linear forwards;filter:drop-shadow(0 2px 3px #a94b7044)}
@keyframes fall{to{transform:translate3d(var(--drift),115vh,0) rotate(540deg);opacity:.9}}
#photo{display:none;width:min(100%,300px);max-height:390px;object-fit:cover;border-radius:20px;
box-shadow:0 12px 30px #9d587744;margin:8px 0 18px}
.show #photo{display:block}.show .heart{display:none}
</style>

<h1 id="heading">A tiny surprise for you...</h1>
<p id="message">I have one very important question.</p>
<button id="next">OPEN THE SURPRISE ✨</button>
<div class="tiny">made with a little extra love ♡</div>
</main>
<script>
const steps = [
["A tiny surprise for you...","I have one very important question.","OPEN THE SURPRISE ✨"],
["Who is the most gorgeous girlfriend in this world?","I think the answer is obvious…","NEXT 💗"],
["Her name starts with J…","Can you guess who I'm talking about?","NEXT"],
["Do you want to see this beauty?","Promise you'll be ready?","SHOW ME 👀"],
["⚠️ WARNING!","You might go blind… because this much beauty is hard to handle.","I'M READY 😎"]
];
let step=0;
const card=document.getElementById("card"), heading=document.getElementById("heading"),
message=document.getElementById("message"), button=document.getElementById("next");
button.addEventListener("click",()=>{
 if(step<steps.length-1){step++; if(step===4) card.classList.add("warning"); heading.textContent=steps[step][0];message.textContent=steps[step][1];button.textContent=steps[step][2];}
 else{
  card.classList.remove("warning");
  card.classList.add("show");
  startEmojiRain();
  heading.textContent="There she is… JASMINE 💖";
  message.textContent="The prettiest view, my favourite person. Your smile makes everything feel a little brighter. ♡";
  button.style.display="none";
 }
});
function startEmojiRain(){
 const rain=document.createElement("div"); rain.className="emoji-rain"; document.body.appendChild(rain);
 const emojis=["💗","💕","💖","🌸","🦋","✨","🥰","💘","🌷"];
 for(let i=0;i<55;i++){
  const piece=document.createElement("span"); piece.textContent=emojis[Math.floor(Math.random()*emojis.length)];
  piece.style.left=Math.random()*100+"vw";
  piece.style.animationDuration=(3+Math.random()*4)+"s";
  piece.style.animationDelay=(Math.random()*2)+"s";
  piece.style.setProperty("--drift",(Math.random()*150-75)+"px");
  rain.appendChild(piece);
 }
 setTimeout(()=>rain.remove(),9000);
}
</script>
</body>
</html>
